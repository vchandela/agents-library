name: references

on: [push, pull_request]

permissions:
  contents: read

jobs:
  in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: sh scripts/sync-references.sh --check
      - run: python3 scripts/lint-skills.py
      - run: python3 -m unittest discover -s tests
      # macOS ships Python 3.9, and a hook that fails to compile there exits 1, which Claude Code
      # treats as a non-blocking error, so every guarded command would run unguarded.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.9"
      - run: python -m py_compile scripts/*.py scripts/setup
      - run: python -m unittest discover -s tests
